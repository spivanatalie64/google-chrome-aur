# Self-updating workflow for the google-chrome-current package.
#
# On a schedule (or manually), it:
#   1. Asks update.sh for the latest stable Chrome version (cheap index query).
#   2. Compares it against pkgver in the PKGBUILD.
#   3. If newer: bumps pkgver/pkgrel, regenerates .SRCINFO, validates, commits,
#      pushes the bump back to GitHub (this repo self-updates), builds the
#      package in an Arch container, and deploys the built .pkg.tar.zst to
#      the server's ~/Packages/google-chrome/ directory.
#
# Secrets required:
#   BUILD_TOKEN   — PAT with "contents: write" on this repo (self-update push)
#   EMANRESU      — SSH target, e.g. "user@host -p 2400"
#   TACO          — SSH password for EMANRESU

name: Check for upstream Chrome release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check for updates and show changes without pushing'
        type: boolean
        default: false

concurrency:
  group: chrome-update
  cancel-in-progress: true

env:
  PKGNAME: google-chrome-current

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest version from Google
        id: latest
        run: |
          VER=$(./update.sh check)
          [ -n "$VER" ] || { echo "Failed to detect latest version"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Read current version from PKGBUILD
        id: current
        run: |
          source PKGBUILD
          echo "version=$pkgver" >> "$GITHUB_OUTPUT"

      - name: Compare
        id: compare
        run: |
          CURRENT=${{ steps.current.outputs.version }}
          LATEST=${{ steps.latest.outputs.version }}
          echo "Current: $CURRENT"
          echo "Latest:  $LATEST"
          [ -n "$LATEST" ] || { echo "Latest version is empty!"; exit 1; }
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "uptodate=true" >> "$GITHUB_OUTPUT"
          else
            echo "uptodate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to do
        if: steps.compare.outputs.uptodate == 'true'
        run: echo "No update needed — current version is already ${{ steps.current.outputs.version }}"

      - name: Update PKGBUILD
        if: steps.compare.outputs.uptodate == 'false'
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.latest.outputs.version }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Regenerate .SRCINFO
        if: steps.compare.outputs.uptodate == 'false'
        run: |
          source PKGBUILD
          {
            echo "pkgbase = $pkgname"
            echo "	pkgdesc = $pkgdesc"
            echo "	pkgver = $pkgver"
            echo "	pkgrel = $pkgrel"
            echo "	url = $url"
            echo "	install = $install"
            for v in "${arch[@]}"; do echo "	arch = $v"; done
            for v in "${license[@]}"; do echo "	license = $v"; done
            for v in "${makedepends[@]}"; do echo "	makedepends = $v"; done
            for v in "${depends[@]}"; do echo "	depends = $v"; done
            for v in "${optdepends[@]}"; do echo "	optdepends = $v"; done
            for v in "${options[@]}"; do echo "	options = $v"; done
            for v in "${source[@]}"; do echo "	source = $v"; done
            for v in "${sha512sums[@]}"; do echo "	sha512sums = $v"; done
            echo ""
            echo "pkgname = $pkgname"
          } > .SRCINFO

      - name: Validate PKGBUILD and .SRCINFO
        if: steps.compare.outputs.uptodate == 'false'
        run: |
          source PKGBUILD
          [ -n "$pkgver" ] || { echo "pkgver is empty!"; exit 1; }
          [[ "$pkgver" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "pkgver format is wrong: $pkgver"; exit 1; }
          [ "$pkgver" = "${{ steps.latest.outputs.version }}" ] \
            || { echo "pkgver in PKGBUILD ($pkgver) != latest (${{ steps.latest.outputs.version }})"; exit 1; }
          [ "${#source[@]}" -eq 3 ] || { echo "Expected 3 sources, got ${#source[@]}"; exit 1; }
          [ "${#sha512sums[@]}" -eq "${#source[@]}" ] \
            || { echo "Checksum count (${#sha512sums[@]}) != source count (${#source[@]})"; exit 1; }
          for s in "${sha512sums[@]}"; do
            [[ "$s" =~ ^[0-9a-f]{128}$ ]] || { echo "Invalid checksum format: $s"; exit 1; }
          done
          grep -q "^[[:space:]]*pkgver = $pkgver" .SRCINFO \
            || { echo ".SRCINFO pkgver out of sync with PKGBUILD"; exit 1; }
          echo "Validation OK: $pkgver-1"

      - name: Dry-run summary
        if: steps.compare.outputs.uptodate == 'false' && github.event.inputs.dry_run == 'true'
        run: |
          echo "═══════════════════════════════════════════"
          echo "  DRY RUN — would push:"
          echo "    ${{ steps.current.outputs.version }} → ${{ steps.latest.outputs.version }}"
          echo "═══════════════════════════════════════════"
          git diff PKGBUILD .SRCINFO

      - name: Commit version bump
        if: steps.compare.outputs.uptodate == 'false' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "upgpkg: ${{ env.PKGNAME }} ${{ steps.latest.outputs.version }}-1

          New upstream release.

          Auto-detected and pushed by the update.yml workflow."

      - name: Push to GitHub (self-update)
        if: steps.compare.outputs.uptodate == 'false' && github.event.inputs.dry_run != 'true'
        env:
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          git push "https://x-access-token:${BUILD_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master

      - name: Build package (Arch container)
        if: steps.compare.outputs.uptodate == 'false' && github.event.inputs.dry_run != 'true'
        run: |
          docker run --rm \
            -v "$PWD":/build \
            archlinux:base-devel \
            bash -lc '
              useradd -m builder
              chown -R builder:builder /build
              su builder -c "cd /build && makepkg -f --noconfirm"
            '

      - name: Deploy package to server
        if: steps.compare.outputs.uptodate == 'false' && github.event.inputs.dry_run != 'true'
        env:
          EMANRESU: ${{ secrets.EMANRESU }}
          TACO: ${{ secrets.TACO }}
        run: |
          # sshpass is not preinstalled on ubuntu-latest.
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          USER_HOST=$(printf '%s\n' "$EMANRESU" | sed -n 's/^\([^ ]*\).*/\1/p')
          PORT=$(printf '%s\n' "$EMANRESU" | sed -n 's/.*-p[ =]*\([0-9]*\).*/\1/p')
          [ -n "$USER_HOST" ] && [ -n "$PORT" ] \
            || { echo "Cannot parse EMANRESU"; exit 1; }
          echo "Deploying to $USER_HOST (port $PORT)"

          # Create the target directory if it does not exist, then ship the
          # freshly built package(s) into it.
          sshpass -p "$TACO" ssh -p "$PORT" -o StrictHostKeyChecking=no "$USER_HOST" \
            "mkdir -p ~/Packages/google-chrome"
          sshpass -p "$TACO" scp -P "$PORT" -o StrictHostKeyChecking=no \
            ./google-chrome-current-*.pkg.tar.zst \
            "$USER_HOST:~/Packages/google-chrome/"
          sshpass -p "$TACO" ssh -p "$PORT" -o StrictHostKeyChecking=no "$USER_HOST" \
            "ls -la ~/Packages/google-chrome/"
